<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Talent Market</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #9be7f6ff 0%, #4d52e0ff 100%);
            color: white;
            padding: 30px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .header-button {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .header-button:hover {
            background: rgba(255,255,255,0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .notification-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .notification-stats {
            color: #666;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notification-item {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            border-left: 5px solid transparent;
        }

        .notification-item.unread {
            border-left-color: #667eea;
            background: linear-gradient(135deg, #f8f9ff 0%, #ffffff 100%);
        }

        .notification-item.read {
            border-left-color: #e5e7eb;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .notification-type {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .notification-icon.booking_request {
            background: #fef3c7;
            color: #92400e;
        }

        .notification-icon.booking_accepted {
            background: #d1fae5;
            color: #065f46;
        }

        .notification-icon.booking_declined {
            background: #fee2e2;
            color: #991b1b;
        }

        .notification-icon.booking_completed {
            background: #e9d5ff;
            color: #6b21a8;
        }

        .notification-icon.new_message {
            background: #dbeafe;
            color: #1e40af;
        }

        .notification-content {
            flex: 1;
            margin-left: 15px;
        }

        .notification-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .notification-message {
            color: #666;
            line-height: 1.5;
            font-size: 14px;
        }

        .notification-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            font-size: 12px;
            color: #999;
        }

        .notification-time {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .notification-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .action-btn.view {
            background: #667eea;
            color: white;
        }

        .action-btn.view:hover {
            background: #5568d3;
        }

        .action-btn.mark-read {
            background: #e5e7eb;
            color: #374151;
        }

        .action-btn.mark-read:hover {
            background: #d1d5db;
        }

        .action-btn.delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-btn.delete:hover {
            background: #fecaca;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .empty-state h3 {
            color: #666;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #999;
        }

        @media (max-width: 768px) {
            .notification-controls {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            
            .control-buttons {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>🔔 Notifications</h1>
            <div class="header-actions">
                <a href="booking_dashboard.html" class="header-button">My Bookings</a>
                <a href="listings.html" class="header-button">Browse Listings</a>
                <a href="index.html" class="header-button">Home</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="notification-controls">
            <div class="notification-stats">
                <span id="notificationStats">Loading notifications...</span>
            </div>
            <div class="control-buttons">
                <button class="btn btn-primary" onclick="markAllAsRead()">
                    Mark All as Read
                </button>
                <button class="btn btn-secondary" onclick="refreshNotifications()">
                    Refresh
                </button>
            </div>
        </div>

        <div class="notifications-list" id="notificationsList">
            <div class="empty-state">
                <h3>Loading notifications...</h3>
                <p>Please wait while we fetch your notifications.</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let allNotifications = [];
        let userRole = '';
        let userId = '';

        // Initialize
        function init() {
            checkAuth();
            loadNotifications();
        }

        // Check authentication
        function checkAuth() {
            const evaluatorId = localStorage.getItem('evaluatorId');
            const jobSeekerId = localStorage.getItem('jobSeekerId');

            if (evaluatorId) {
                userRole = 'evaluator';
                userId = evaluatorId;
            } else if (jobSeekerId) {
                userRole = 'job_seeker';
                userId = jobSeekerId;
            } else {
                alert('Please sign in to view notifications');
                window.location.href = 'sign_in.html';
                return false;
            }

            return true;
        }

        // Load notifications
        async function loadNotifications() {
            if (!userId || !userRole) return;

            try {
                const response = await fetch(`${API_BASE}/api/notifications?user_role=${userRole}&user_id=${userId}`);
                
                if (response.ok) {
                    allNotifications = await response.json();
                    renderNotifications();
                    updateStats();
                } else {
                    console.error('Failed to load notifications');
                    showEmptyState('Error loading notifications');
                }
            } catch (error) {
                console.error('Error loading notifications:', error);
                showEmptyState('No notifications yet');
            }
        }

        // Render notifications
        function renderNotifications() {
            const container = document.getElementById('notificationsList');

            if (allNotifications.length === 0) {
                showEmptyState('No notifications yet');
                return;
            }

            container.innerHTML = allNotifications.map(notification => 
                createNotificationCard(notification)
            ).join('');
        }

        // Create notification card HTML
        function createNotificationCard(notification) {
            const timeAgo = formatTimeAgo(notification.created_at);
            const icon = getNotificationIcon(notification.type);

            return `
                <div class="notification-item ${notification.is_read ? 'read' : 'unread'}">
                    <div class="notification-header">
                        <div class="notification-type">
                            <div class="notification-icon ${notification.type}">
                                ${icon}
                            </div>
                            <div class="notification-content">
                                <div class="notification-title">${notification.title}</div>
                                <div class="notification-message">${notification.message}</div>
                            </div>
                        </div>
                    </div>
                    <div class="notification-meta">
                        <div class="notification-time">
                            <span>${timeAgo}</span>
                        </div>
                        <div class="notification-actions">
                            ${notification.related_id ? `
                                <button class="action-btn view" onclick="viewRelated('${notification.type}', ${notification.related_id})">
                                    View
                                </button>
                            ` : ''}
                            ${!notification.is_read ? `
                                <button class="action-btn mark-read" onclick="markAsRead(${notification.id})">
                                    Mark Read
                                </button>
                            ` : ''}
                            <button class="action-btn delete" onclick="deleteNotification(${notification.id})">
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Get notification icon
        function getNotificationIcon(type) {
            const icons = {
                'booking_request': '📅',
                'booking_accepted': '✅',
                'booking_declined': '❌',
                'booking_completed': '🎉',
                'new_message': '💬'
            };
            return icons[type] || '🔔';
        }

        // Format time ago
        function formatTimeAgo(timestamp) {
            const now = new Date();
            const time = new Date(timestamp);
            const diff = Math.floor((now - time) / 1000);

            if (diff < 60) return 'Just now';
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
            
            return time.toLocaleDateString();
        }

        // Update stats
        function updateStats() {
            const unreadCount = allNotifications.filter(n => !n.is_read).length;
            const totalCount = allNotifications.length;
            
            document.getElementById('notificationStats').textContent = 
                `${unreadCount} unread of ${totalCount} total notifications`;
        }

        // Mark notification as read
        async function markAsRead(notificationId) {
            try {
                const response = await fetch(`${API_BASE}/api/notifications/${notificationId}/read?user_id=${userId}`, {
                    method: 'PUT'
                });

                if (response.ok) {
                    loadNotifications(); // Reload notifications
                }
            } catch (error) {
                console.error('Error marking notification as read:', error);
            }
        }

        // Mark all notifications as read
        async function markAllAsRead() {
            try {
                const response = await fetch(`${API_BASE}/api/notifications/read-all?user_role=${userRole}&user_id=${userId}`, {
                    method: 'PUT'
                });

                if (response.ok) {
                    loadNotifications(); // Reload notifications
                }
            } catch (error) {
                console.error('Error marking all notifications as read:', error);
            }
        }

        // Delete notification
        async function deleteNotification(notificationId) {
            if (!confirm('Are you sure you want to delete this notification?')) return;

            try {
                const response = await fetch(`${API_BASE}/api/notifications/${notificationId}?user_id=${userId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadNotifications(); // Reload notifications
                }
            } catch (error) {
                console.error('Error deleting notification:', error);
            }
        }

        // View related content
        function viewRelated(type, relatedId) {
            switch (type) {
                case 'booking_request':
                case 'booking_accepted':
                case 'booking_declined':
                case 'booking_completed':
                    window.location.href = 'booking_dashboard.html';
                    break;
                case 'new_message':
                    window.location.href = 'messages.html';
                    break;
                default:
                    alert('Cannot view this item');
            }
        }

        // Refresh notifications
        function refreshNotifications() {
            loadNotifications();
        }

        // Show empty state
        function showEmptyState(message) {
            document.getElementById('notificationsList').innerHTML = `
                <div class="empty-state">
                    <h3>${message}</h3>
                    <p>When you receive notifications, they'll appear here.</p>
                </div>
            `;
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
