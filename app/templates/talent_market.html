<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Market - Browse Freelancers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #9be7f6ff 0%, #4d52e0ff 100%);
            color: white;
            padding: 30px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-button {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .header-button:hover {
            background: rgba(255,255,255,0.3);
        }

        .user-info {
            display: none;
            align-items: center;
            gap: 15px;
            color: white;
            font-weight: 600;
        }

        .user-info.active {
            display: flex;
        }

        .user-info .user-name {
            cursor: pointer;
            padding: 8px 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            transition: all 0.3s;
        }

        .user-info .user-name:hover {
            background: rgba(255,255,255,0.2);
        }

        .notification-icon {
            position: relative;
        }

        .notification-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            min-width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .sign-out-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .sign-out-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .search-filters {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .search-box {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-box input,
        .search-box select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-box input:focus,
        .search-box select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-button:hover {
            background: #5568d3;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .talents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .talent-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .talent-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .talent-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .talent-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9be7f6ff 0%, #4d52e0ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-right: 15px;
        }

        .talent-info h3 {
            color: #333;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .talent-location {
            color: #666;
            font-size: 14px;
        }

        .talent-skills {
            margin-bottom: 15px;
        }

        .skill-tag {
            display: inline-block;
            background: #f0f4ff;
            color: #667eea;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .talent-rating {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .stars {
            color: #ffd700;
            margin-right: 8px;
        }

        .rating-text {
            color: #666;
            font-size: 14px;
        }

        .talent-availability {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .available {
            background: #d1fae5;
            color: #065f46;
        }

        .busy {
            background: #fef3c7;
            color: #92400e;
        }

        .selective {
            background: #e0e7ff;
            color: #3730a3;
        }

        .talent-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            text-align: center;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .btn-disabled {
            background: #f3f4f6;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 18px;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .no-results h3 {
            color: #666;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .no-results p {
            color: #999;
        }

        /* Rating Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .rating-stars {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .star {
            font-size: 24px;
            color: #e5e7eb;
            cursor: pointer;
            transition: color 0.2s;
        }

        .star:hover,
        .star.active {
            color: #ffd700;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .btn-cancel {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-submit {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-box {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .talents-grid {
                grid-template-columns: 1fr;
            }

            .talent-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>Talent Market</h1>
            <div class="header-actions">
                <div class="user-info" id="userInfo">
                    <div class="notification-icon">
                        <a href="notifications.html" class="header-button">
                            🔔 Notifications
                            <span id="notificationBadge" class="notification-badge" style="display: none;">0</span>
                        </a>
                    </div>
                    <div class="header-button" id="currentUserName" onclick="userNameClicked()"></div>
                    <button class="header-button" onclick="signOut()">Sign Out</button>
                </div>
                <a href="messages.html" class="header-button">Messages</a>
                <a href="sign_in.html" class="header-button" id="signInBtn">Sign In</a>
                <a href="listings.html" class="header-button">Service Listings</a>
                <a href="create_listings.html" class="header-button" id="createListingBtn" style="background: #10b981; display: none;">
                    Create Listings
                </a>
                <a href="index.html" class="header-button">Home</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="search-filters">
            <div class="search-box">
                <input type="text" id="searchName" placeholder="Search freelancers by name or skills...">
                <select id="filterStatus">
                    <option value="">All Status</option>
                    <option value="available">Available Immediately</option>
                    <option value="busy">Currently Busy</option>
                    <option value="selective">Open to Opportunities</option>
                </select>
                <button class="search-button" onclick="loadTalents()">Search</button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-card">
                <h3>Total Freelancers</h3>
                <div class="value" id="totalTalents">0</div>
            </div>
            <div class="stat-card">
                <h3>Average Rating</h3>
                <div class="value" id="avgRating">0.0</div>
            </div>
            <div class="stat-card">
                <h3>Total Reviews</h3>
                <div class="value" id="totalReviews">0</div>
            </div>
        </div>

        <div id="talentsContainer" class="talents-grid">
            <div class="loading">Loading freelancers...</div>
        </div>
    </div>

    <!-- Rating Modal -->
    <div id="ratingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Rate Freelancer</h2>
                <p id="modalFreelancerName"></p>
            </div>
            <form id="ratingForm">
                <div class="form-group">
                    <label>Rating</label>
                    <div class="rating-stars" id="ratingStars">
                        <span class="star" data-rating="1">★</span>
                        <span class="star" data-rating="2">★</span>
                        <span class="star" data-rating="3">★</span>
                        <span class="star" data-rating="4">★</span>
                        <span class="star" data-rating="5">★</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Review (Optional)</label>
                    <textarea id="reviewText" placeholder="Share your experience working with this freelancer..." rows="4"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeRatingModal()">Cancel</button>
                    <button type="submit" class="btn btn-submit">Submit Rating</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let allTalents = [];
        let selectedRating = 0;
        let currentFreelancer = null;

        // Authentication functions
        function getCurrentUser() {
            const evaluatorId = localStorage.getItem('evaluatorId');
            const evaluatorName = localStorage.getItem('evaluatorName');
            const evaluatorCompany = localStorage.getItem('evaluatorCompany');

            const jobSeekerId = localStorage.getItem('jobSeekerId');
            const jobSeekerName = localStorage.getItem('jobSeekerName');

            if (evaluatorId && evaluatorName) {
                return {
                    id: evaluatorId,
                    name: evaluatorName,
                    company: evaluatorCompany,
                    role: 'employer',
                    roleKey: 'evaluator',
                    email: localStorage.getItem('evaluatorEmail')
                };
            } else if (jobSeekerId && jobSeekerName) {
                return {
                    id: jobSeekerId,
                    name: jobSeekerName,
                    role: 'freelancer',
                    roleKey: 'job_seeker',
                    email: localStorage.getItem('jobSeekerEmail')
                };
            }
            
            return null;
        }

        function signOut() {
            localStorage.removeItem('evaluatorId');
            localStorage.removeItem('evaluatorName');
            localStorage.removeItem('evaluatorEmail');
            localStorage.removeItem('evaluatorCompany');
            localStorage.removeItem('jobSeekerId');
            localStorage.removeItem('jobSeekerName');
            localStorage.removeItem('jobSeekerEmail');
            localStorage.removeItem('freelancerId');
            localStorage.removeItem('freelancerName');
            localStorage.removeItem('freelancerEmail');
            
            window.location.href = 'index.html';
        }

        function updateUserHeader() {
            const user = getCurrentUser();
            const userInfo = document.getElementById('userInfo');
            const currentUserNameEl = document.getElementById('currentUserName');
            const signInBtn = document.getElementById('signInBtn');

            if (user) {
                userInfo.classList.add('active');
                userInfo.style.display = 'flex';
                
                const displayText = user.role === 'employer' && user.company
                    ? `${user.name} (${user.company})`
                    : user.name;
                currentUserNameEl.textContent = `${displayText} [${user.role === 'employer' ? 'Employer' : 'Freelancer'}]`;
                
                signInBtn.style.display = 'none';
            } else {
                userInfo.classList.remove('active');
                userInfo.style.display = 'none';
                signInBtn.style.display = 'block';
            }
        }

        function userNameClicked() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'sign_in.html';
                return;
            }
        
            // Both roles go to unified booking dashboard
            window.location.href = 'booking_dashboard.html';
        }

        // Initialize page
        function init() {
            updateUserHeader();
            loadTalents();
            loadNotificationCount();
            initRatingModal();
            checkPendingRating();
        }

        // Check for pending rating from booking dashboard
        function checkPendingRating() {
            const pendingRating = localStorage.getItem('pendingRating');
            if (pendingRating) {
                try {
                    const ratingData = JSON.parse(pendingRating);
                    localStorage.removeItem('pendingRating');
                    
                    // Find the freelancer and open rating modal
                    setTimeout(() => {
                        const freelancerCard = document.querySelector(`[data-freelancer-id="${ratingData.freelancerId}"]`);
                        if (freelancerCard) {
                            freelancerCard.scrollIntoView({ behavior: 'smooth' });
                            setTimeout(() => {
                                openRatingModal(ratingData.freelancerId, ratingData.freelancerName);
                            }, 500);
                        }
                    }, 1000);
                } catch (error) {
                    localStorage.removeItem('pendingRating');
                }
            }
        }

        // Load all talents
        async function loadTalents() {
            try {
                const response = await fetch(`${API_BASE}/api/freelancers`);

                if (response.ok) {
                    allTalents = await response.json();
                    await loadRatingsData();
                    renderTalents();
                    updateStats();
                    return;
                }

                console.error('Failed to load freelancers');
            } catch (error) {
                console.error('Error loading freelancers:', error);
            }

            document.getElementById('talentsContainer').innerHTML = `
                <div class="no-results">
                    <h3>Error loading freelancers</h3>
                    <p>Please refresh the page and try again.</p>
                </div>
            `;
        }

        // Load ratings data for all talents
        async function loadRatingsData() {
            for (let talent of allTalents) {
                try {
                    const response = await fetch(`${API_BASE}/api/ratings/freelancer/${talent.id}`);
                    if (response.ok) {
                        const ratings = await response.json();
                        talent.ratings = ratings;
                        talent.averageRating = ratings.length > 0 
                            ? ratings.reduce((sum, r) => sum + r.rating, 0) / ratings.length 
                            : 0;
                        talent.totalRatings = ratings.length;
                    } else {
                        talent.ratings = [];
                        talent.averageRating = 0;
                        talent.totalRatings = 0;
                    }
                } catch (error) {
                    talent.ratings = [];
                    talent.averageRating = 0;
                    talent.totalRatings = 0;
                }
            }
        }

        // Render talents
        function renderTalents() {
            const searchName = document.getElementById('searchName').value.toLowerCase();
            const filterStatus = document.getElementById('filterStatus').value;

            let filtered = allTalents.filter(talent => {
                const matchesName = !searchName || 
                    talent.name.toLowerCase().includes(searchName) ||
                    (talent.skills && talent.skills.toLowerCase().includes(searchName));
                const matchesStatus = !filterStatus || talent.availability === filterStatus;
                return matchesName && matchesStatus;
            });

            const container = document.getElementById('talentsContainer');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <h3>No freelancers found</h3>
                        <p>Try adjusting your search criteria or check back later.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(talent => createTalentCard(talent)).join('');
        }

        // Create talent card
        function createTalentCard(talent) {
            const user = getCurrentUser();
            const canRate = user && user.role === 'employer';
            const initials = talent.name.split(' ').map(n => n[0]).join('').toUpperCase();
            const skills = talent.skills ? talent.skills.split(',').slice(0, 5) : [];

            const stars = '★'.repeat(Math.floor(talent.averageRating)) + 
                         '☆'.repeat(5 - Math.floor(talent.averageRating));

            return `
                <div class="talent-card" data-freelancer-id="${talent.id}">
                    <div class="talent-header">
                        <div class="talent-avatar">${initials}</div>
                        <div class="talent-info">
                            <h3>${talent.name}</h3>
                            <div class="talent-location">${talent.location || 'Location not specified'}</div>
                        </div>
                    </div>

                    <div class="talent-skills">
                        ${skills.map(skill => `<span class="skill-tag">${skill.trim()}</span>`).join('')}
                        ${skills.length === 0 ? '<span class="skill-tag">Skills not specified</span>' : ''}
                    </div>

                    <div class="talent-rating">
                        <div class="stars">${stars}</div>
                        <div class="rating-text">
                            ${talent.averageRating.toFixed(1)} (${talent.totalRatings} review${talent.totalRatings !== 1 ? 's' : ''})
                        </div>
                    </div>

                    <div class="talent-availability ${talent.availability || 'available'}">
                        ${getAvailabilityText(talent.availability)}
                    </div>

                    <div class="talent-actions">
                        ${canRate ? `
                            <button class="btn btn-primary" onclick="openRatingModal(${talent.id}, '${talent.name.replace(/'/g, "\\'")}')">
                                Rate Freelancer
                            </button>
                        ` : `
                            <button class="btn btn-disabled" disabled title="Sign in as employer to rate">
                                Rate Freelancer
                            </button>
                        `}
                        <button class="btn btn-secondary" onclick="messageFreelancer(${talent.id}, '${talent.name.replace(/'/g, "\\'")}')">
                            Message
                        </button>
                    </div>
                </div>
            `;
        }

        function getAvailabilityText(availability) {
            switch (availability) {
                case 'available': return 'Available Immediately';
                case 'busy': return 'Currently Busy';
                case 'selective': return 'Open to Opportunities';
                default: return 'Available Immediately';
            }
        }

        // Update statistics
        function updateStats() {
            const totalTalents = allTalents.length;
            const totalReviews = allTalents.reduce((sum, t) => sum + t.totalRatings, 0);
            const avgRating = totalReviews > 0 
                ? allTalents.reduce((sum, t) => sum + (t.averageRating * t.totalRatings), 0) / totalReviews
                : 0;

            document.getElementById('totalTalents').textContent = totalTalents;
            document.getElementById('avgRating').textContent = avgRating.toFixed(1);
            document.getElementById('totalReviews').textContent = totalReviews;
        }

        // Rating modal functions
        function initRatingModal() {
            const stars = document.querySelectorAll('.star');
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    selectedRating = parseInt(this.dataset.rating);
                    updateStarDisplay();
                });
            });

            document.getElementById('ratingForm').addEventListener('submit', submitRating);
        }

        function openRatingModal(freelancerId, freelancerName) {
            const user = getCurrentUser();
            if (!user || user.role !== 'employer') {
                alert('Please sign in as an employer to rate freelancers.');
                window.location.href = 'sign_in.html';
                return;
            }

            currentFreelancer = { id: freelancerId, name: freelancerName };
            document.getElementById('modalFreelancerName').textContent = freelancerName;
            selectedRating = 0;
            updateStarDisplay();
            document.getElementById('reviewText').value = '';
            document.getElementById('ratingModal').classList.add('active');
        }

        function closeRatingModal() {
            document.getElementById('ratingModal').classList.remove('active');
            currentFreelancer = null;
            selectedRating = 0;
        }

        function updateStarDisplay() {
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, index) => {
                star.classList.toggle('active', index < selectedRating);
            });
        }

        async function submitRating(event) {
            event.preventDefault();
            
            if (selectedRating === 0) {
                alert('Please select a rating');
                return;
            }

            const user = getCurrentUser();
            const reviewText = document.getElementById('reviewText').value.trim();

            try {
                const response = await fetch(`${API_BASE}/api/ratings`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        freelancer_id: currentFreelancer.id,
                        evaluator_id: parseInt(user.id),
                        rating: selectedRating,
                        review_text: reviewText || null
                    })
                });

                if (response.ok) {
                    alert('Rating submitted successfully!');
                    closeRatingModal();
                    loadTalents(); // Refresh to show new rating
                } else {
                    const error = await response.json();
                    alert('Error submitting rating: ' + (error.detail || 'Please try again'));
                }
            } catch (error) {
                console.error('Error submitting rating:', error);
                alert('Error submitting rating. Please try again.');
            }
        }
        
        function updateUserHeader() {
            const user = getCurrentUser();
            const userInfo = document.getElementById('userInfo');
            const currentUserNameEl = document.getElementById('currentUserName');
            const signInBtn = document.getElementById('signInBtn');
            const createListingBtn = document.getElementById('createListingBtn');
        
            if (user) {
                userInfo.classList.add('active');
                userInfo.style.display = 'flex';
                
                const displayText = user.role === 'employer' && user.company
                    ? `${user.name} (${user.company})`
                    : user.name;
                currentUserNameEl.textContent = `${displayText} [${user.role === 'employer' ? 'Employer' : 'Freelancer'}]`;
                
                signInBtn.style.display = 'none';
                
                // Show Create Listing button ONLY for freelancers
                if (user.role === 'freelancer') {
                    createListingBtn.style.display = 'inline-block';
                } else {
                    createListingBtn.style.display = 'none';
                }
            } else {
                userInfo.classList.remove('active');
                userInfo.style.display = 'none';
                signInBtn.style.display = 'inline-block';
                createListingBtn.style.display = 'none';
            }
        }

        // Message freelancer
        function messageFreelancer(freelancerId, freelancerName) {
            const user = getCurrentUser();
            
            if (!user) {
                alert('Please sign in to start a conversation');
                window.location.href = 'sign_in.html';
                return;
            }
            
            if (user.role === 'freelancer') {
                window.location.href = `messages.html?user_role=job_seeker&user_id=${user.id}&freelancer_id=${freelancerId}`;
            } else {
                window.location.href = `messages.html?user_role=evaluator&user_id=${user.id}&freelancer_id=${freelancerId}`;
            }
        }

        // Load notification count
        async function loadNotificationCount() {
            const user = getCurrentUser();
            if (!user) return;

            try {
                const response = await fetch(`${API_BASE}/api/notifications/unread-count?user_role=${user.roleKey}&user_id=${user.id}`);
                
                if (!response.ok) return;

                const data = await response.json();
                const badge = document.getElementById('notificationBadge');

                if (data.unread_count > 0) {
                    badge.textContent = data.unread_count;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            } catch (error) {
                console.warn('Failed to load notification count:', error);
            }
        }

        // Close modal when clicking outside
        document.addEventListener('click', function(event) {
            const modal = document.getElementById('ratingModal');
            if (event.target === modal) {
                closeRatingModal();
            }
        });

        // Initialize on load
        init();

        // Refresh data every 30 seconds
        setInterval(() => {
            loadNotificationCount();
        }, 30000);
    </script>
</body>
</html>
