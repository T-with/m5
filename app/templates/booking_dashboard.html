<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Booking Requests</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #9be7f6ff 0%, #4d52e0ff 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: white;
            padding: 20px 40px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-button {
            padding: 10px 20px;
            background: #4d52e0ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .header-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #595962ff;
            font-weight: 600;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .stat-card .value {
            color: #667eea;
            font-size: 32px;
            font-weight: bold;
        }

        .filter-tabs {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .tab {
            padding: 12px 24px;
            border: 2px solid #e0e0e0;
            background: white;
            color: #666;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .tab.active {
            padding: 12px 24px;
            border: 2px solid #4d52e0ff;
            background: #4d52e0ff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .booking-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
        }

        .booking-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .booking-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .booking-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .booking-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending { background: #fef3c7; color: #92400e; }
        .status-accepted { background: #d1fae5; color: #065f46; }
        .status-in_progress { background: #dbeafe; color: #1e40af; }
        .status-completed { background: #e0e7ff; color: #3730a3; }
        .status-declined { background: #fee2e2; color: #991b1b; }

        .booking-info {
            margin: 15px 0;
            line-height: 1.8;
        }

        .booking-info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .booking-info-label {
            color: #666;
            font-weight: 600;
        }

        .booking-info-value {
            color: #333;
        }

        .booking-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            min-width: 120px;
        }

        .btn-accept {
            background: #10b981;
            color: white;
        }

        .btn-decline {
            background: #ef4444;
            color: white;
        }

        .btn-complete {
            background: #6366f1;
            color: white;
        }

        .btn-progress {
            background: #3b82f6;
            color: white;
        }

        .btn-message {
            background: #667eea;
            color: white;
        }

        .btn-rate {
            background: #f59e0b;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            background: #d1d5db;
            color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .empty-state h3 {
            color: #666;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #999;
            font-size: 16px;
        }

        .notification-badge {
            background: #ef4444;
            color: white;
            border-radius: 50%;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 5px;
        }

        @media (max-width: 768px) {
            .booking-grid {
                grid-template-columns: 1fr;
            }
            
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .filter-tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1 id="pageTitle">My Booking Requests</h1>
            <div class="header-actions">
                <div class="user-info" id="userInfo">
                    <span id="userName"></span>
                </div>
                <div class="notification-icon">
                    <a href="notifications.html" class="header-button">
                        🔔 Notifications
                        <span id="notificationBadge" class="notification-badge" style="display: none;">0</span>
                    </a>
                </div>
                <a href="messages.html" class="header-button">Messages</a>
                <a href="listings.html" class="header-button">Browse Services</a>
                <a href="talent_market.html" class="header-button">Browse Talent</a>
                <a href="index.html" class="header-button">Home</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Pending Requests</h3>
                <div class="value" id="pendingCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Active Bookings</h3>
                <div class="value" id="activeCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <div class="value" id="completedCount">0</div>
            </div>
            <div class="stat-card">
                <h3 id="totalLabel">Total Earned</h3>
                <div class="value" id="totalAmount">$0</div>
            </div>
        </div>

        <div class="filter-tabs">
            <button class="tab active" data-filter="all" onclick="filterBookings('all')">
                All Requests
            </button>
            <button class="tab" data-filter="pending" onclick="filterBookings('pending')">
                Pending
            </button>
            <button class="tab" data-filter="accepted" onclick="filterBookings('accepted')">
                Accepted
            </button>
            <button class="tab" data-filter="in_progress" onclick="filterBookings('in_progress')">
                In Progress
            </button>
            <button class="tab" data-filter="completed" onclick="filterBookings('completed')">
                Completed
            </button>
        </div>

        <div class="booking-grid" id="bookingGrid">
            <div class="empty-state">
                <h3>Loading your booking requests...</h3>
                <p>Please wait while we fetch your booking history.</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let allBookings = [];
        let currentFilter = 'all';
        let currentUser = null;
        let userRole = '';  // 'freelancer' or 'employer'

        function getCurrentUser() {
            // Check for freelancer
            const jobSeekerId = localStorage.getItem('jobSeekerId');
            const jobSeekerName = localStorage.getItem('jobSeekerName');
            
            if (jobSeekerId && jobSeekerName) {
                return {
                    id: jobSeekerId,
                    name: jobSeekerName,
                    role: 'freelancer',
                    roleKey: 'job_seeker',
                    email: localStorage.getItem('jobSeekerEmail')
                };
            }
            
            // Check for employer
            const evaluatorId = localStorage.getItem('evaluatorId');
            const evaluatorName = localStorage.getItem('evaluatorName');
            const evaluatorCompany = localStorage.getItem('evaluatorCompany');
            
            if (evaluatorId && evaluatorName) {
                return {
                    id: evaluatorId,
                    name: evaluatorName,
                    company: evaluatorCompany,
                    role: 'employer',
                    roleKey: 'evaluator',
                    email: localStorage.getItem('evaluatorEmail')
                };
            }
            
            return null;
        }

        // Initialize page
        function init() {
            currentUser = getCurrentUser();
            
            if (!currentUser) {
                alert('Please sign in to view your booking requests');
                window.location.href = 'sign_in.html';
                return;
            }

            userRole = currentUser.role;
            
            // Update UI based on role
            updateUIForRole();
            
            // Load bookings
            loadBookings();
            loadNotificationCount();
        }

        // Update UI elements based on user role
        function updateUIForRole() {
            const pageTitle = document.getElementById('pageTitle');
            const userName = document.getElementById('userName');
            const totalLabel = document.getElementById('totalLabel');

            if (userRole === 'freelancer') {
                pageTitle.textContent = 'My Booking Requests (Freelancer)';
                totalLabel.textContent = 'Total Earned';
                const displayName = currentUser.name;
                userName.textContent = `👤 ${displayName} [Freelancer]`;
            } else {
                pageTitle.textContent = 'My Booking Requests (Employer)';
                totalLabel.textContent = 'Total Spent';
                const displayName = currentUser.company 
                    ? `${currentUser.name} (${currentUser.company})`
                    : currentUser.name;
                userName.textContent = `👤 ${displayName} [Employer]`;
            }
        }

        // Load booking requests based on role
        async function loadBookings() {
            const user = getCurrentUser();
            if (!user) return;
        
            try {
                let response;
                
                // Load appropriate bookings based on role
                if (user.role === 'freelancer') {
                    // Freelancers see incoming requests
                    response = await fetch(`${API_BASE}/api/bookings/freelancer/${user.id}`);
                } else {
                    // Employers see sent requests
                    response = await fetch(`${API_BASE}/api/bookings/client?client_role=evaluator&client_id=${user.id}`);
                }
                
                if (response.ok) {
                    allBookings = await response.json();
                    renderBookings();
                    updateStats();
                } else {
                    console.error('Failed to load bookings');
                    document.getElementById('bookingGrid').innerHTML = `
                        <div class="empty-state">
                            <h3>Error loading booking requests</h3>
                            <p>Please refresh the page and try again.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading bookings:', error);
                const user = getCurrentUser();
                const emptyMessage = user && user.role === 'freelancer'
                    ? 'When clients book your services, they will appear here.'
                    : 'Your sent booking requests will appear here.';
                    
                document.getElementById('bookingGrid').innerHTML = `
                    <div class="empty-state">
                        <h3>No booking requests yet</h3>
                        <p>${emptyMessage}</p>
                        <a href="listings.html" class="btn btn-primary">Browse Services</a>
                    </div>
                `;
            }
        }

        // Render bookings based on filter
        function renderBookings() {
            const filtered = currentFilter === 'all' 
                ? allBookings 
                : allBookings.filter(booking => booking.status === currentFilter);

            const grid = document.getElementById('bookingGrid');

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>No ${currentFilter === 'all' ? '' : currentFilter} booking requests</h3>
                        <p>${userRole === 'freelancer' 
                            ? 'Booking requests will appear here when clients book your services.' 
                            : 'Your sent booking requests will appear here.'}</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(booking => `
                <div class="booking-card">
                    <div class="booking-header">
                        <div>
                            <div class="booking-title">${booking.listing_title || 'Service Booking'}</div>
                            <div style="color: #667eea; font-weight: 600; margin-top: 5px;">
                                ${userRole === 'freelancer' 
                                    ? `Client: ${booking.client_name || 'Unknown'}` 
                                    : `Freelancer: ${booking.freelancer_name || 'Unknown'}`}
                            </div>
                        </div>
                        <span class="booking-status status-${booking.status}">
                            ${booking.status.replace('_', ' ').toUpperCase()}
                        </span>
                    </div>

                    <div class="booking-info">
                        <div class="booking-info-item">
                            <span class="booking-info-label">Date:</span>
                            <span class="booking-info-value">${booking.requested_date || 'Not specified'}</span>
                        </div>
                        ${booking.requested_time ? `
                            <div class="booking-info-item">
                                <span class="booking-info-label">Time:</span>
                                <span class="booking-info-value">${booking.requested_time}</span>
                            </div>
                        ` : ''}
                        <div class="booking-info-item">
                            <span class="booking-info-label">Location:</span>
                            <span class="booking-info-value">${booking.location || 'Not specified'}</span>
                        </div>
                        ${booking.description ? `
                            <div class="booking-info-item">
                                <span class="booking-info-label">Details:</span>
                                <span class="booking-info-value">${booking.description}</span>
                            </div>
                        ` : ''}
                        ${booking.freelancer_price || booking.final_price ? `
                            <div class="booking-info-item">
                                <span class="booking-info-label">Set Price:</span>
                                <span class="booking-info-value" style="color: #10b981; font-weight: 700;">
                                    $${(booking.freelancer_price || booking.final_price || 0).toFixed(2)}
                                </span>
                            </div>
                        ` : ''}
                        ${booking.client_budget ? `
                            <div class="booking-info-item">
                                <span class="booking-info-label">Client Budget:</span>
                                <span class="booking-info-value" style="color: #3b82f6; font-weight: 600;">
                                    $${booking.client_budget.toFixed(2)}
                                </span>
                            </div>
                        ` : ''}
                        ${booking.price_difference_percent !== null && booking.price_difference_percent !== undefined ? `
                            <div class="booking-info-item">
                                <span class="booking-info-label">Price Difference:</span>
                                <span class="booking-info-value" style="color: ${booking.price_difference_percent >= 0 ? '#10b981' : '#ef4444'}; font-weight: 700;">
                                    ${booking.price_difference_percent > 0 ? '+' : ''}${booking.price_difference_percent.toFixed(1)}%
                                    ${booking.price_difference_percent >= 0 
                                        ? '(Budget higher)' 
                                        : '(Budget lower ⚠️)'}
                                </span>
                            </div>
                        ` : ''}
                    </div>

                    <div class="booking-actions">
                        ${getActionsForBooking(booking)}
                    </div>
                </div>
            `).join('');
        }

        // Get appropriate actions based on role and booking status
        function getActionsForBooking(booking) {
            const actions = [];

            if (userRole === 'freelancer') {
                // FREELANCER ACTIONS
                if (booking.status === 'pending') {
                    actions.push(`
                        <button class="btn btn-accept" onclick="acceptBooking(${booking.id})">
                            ✅ Accept
                        </button>
                        <button class="btn btn-decline" onclick="declineBooking(${booking.id})">
                            ❌ Decline
                        </button>
                    `);
                } else if (booking.status === 'accepted') {
                    actions.push(`
                        <button class="btn btn-progress" onclick="markInProgress(${booking.id})">
                            Start Work
                        </button>
                    `);
                } else if (booking.status === 'in_progress') {
                        actions.push(`
                            <div style="padding: 12px; background: #dbeafe; color: #1e40af; border-radius: 8px; text-align: center; font-weight: 600;">
                                Work in Progress - Waiting for client to confirm completion
                            </div>
                        `);
                    }
                
                // Message client button (always available)
                actions.push(`
                    <button class="btn btn-message" onclick="messageClient(${booking.client_id})">
                        Message Client
                    </button>
                `);
            } else {
                // EMPLOYER ACTIONS
                // Message freelancer button (always available)
                actions.push(`
                    <button class="btn btn-message" onclick="messageFreelancer(${booking.freelancer_id})">
                        Message Freelancer
                    </button>
                `);
                
                // Complete button for in_progress bookings (EMPLOYER ONLY)
                if (booking.status === 'in_progress') {
                    actions.push(`
                        <button class="btn btn-complete" onclick="markCompleteAsEmployer(${booking.id})">
                            Mark Complete & Close
                        </button>
                    `);
                }
                
                // Rate button for completed bookings
                if (booking.status === 'completed') {
                    actions.push(`
                        <button class="btn btn-rate" onclick="rateFreelancer(${booking.freelancer_id}, '${booking.freelancer_name}')">
                            Rate Freelancer
                        </button>
                    `);
                }
            }

            return actions.join('');
        }

        // FREELANCER ACTIONS - FIXED API ENDPOINTS
        async function acceptBooking(bookingId) {
            if (!confirm('Accept this booking request?')) return;

            const freelancerId = currentUser.id;

            try {
                const response = await fetch(`${API_BASE}/api/bookings/${bookingId}?freelancer_id=${freelancerId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'accepted' })
                });

                if (response.ok) {
                    alert('Booking accepted!');
                    loadBookings();
                } else {
                    const errorData = await response.json();
                    alert(`Failed: ${errorData.detail || 'Unknown error'}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error accepting booking');
            }
        }

        async function declineBooking(bookingId) {
            if (!confirm('Decline this booking request?')) return;

            const freelancerId = currentUser.id;

            try {
                const response = await fetch(`${API_BASE}/api/bookings/${bookingId}?freelancer_id=${freelancerId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'declined' })
                });

                if (response.ok) {
                    alert('Booking declined');
                    loadBookings();
                } else {
                    const errorData = await response.json();
                    alert(`❌ Failed: ${errorData.detail || 'Unknown error'}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error declining booking');
            }
        }

        async function markInProgress(bookingId) {
            if (!confirm('Mark this booking as in progress?')) return;

            const freelancerId = currentUser.id;

            try {
                const response = await fetch(`${API_BASE}/api/bookings/${bookingId}?freelancer_id=${freelancerId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'in_progress' })
                });

                if (response.ok) {
                    alert('Marked as in progress!');
                    loadBookings();
                } else {
                    const errorData = await response.json();
                    alert(`Failed: ${errorData.detail || 'Unknown error'}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error updating status');
            }
        }

        async function markComplete(bookingId) {
            // This function should only be called by employers now
            // Redirect to employer version
            alert('⚠️ Only employers can mark bookings as complete to prevent fraud.');
            return;
        }

        // EMPLOYER-ONLY: Mark booking as complete
        async function markCompleteAsEmployer(bookingId) {
            if (!confirm('⚠️ Mark this booking as complete?\n\nThis will:\n• Confirm the work is done\n• Close the booking\n• Allow you to rate the freelancer\n\nThis action cannot be undone.')) return;
        
            const user = getCurrentUser();
            if (!user || user.role !== 'employer') {
                alert('Only employers can mark bookings as complete');
                return;
            }
        
            try {
                const response = await fetch(`${API_BASE}/api/bookings/${bookingId}?employer_id=${user.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        status: 'completed',
                        completed_by: 'employer'
                    })
                });
        
                if (response.ok) {
                    alert('Booking marked as complete!\n\nYou can now rate the freelancer.');
                    loadBookings();
                } else {
                    const errorData = await response.json();
                    alert(`Failed: ${errorData.detail || 'Unknown error'}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error completing booking');
            }
        }

        function messageClient(clientId) {
            window.location.href = `messages.html?user_role=job_seeker&user_id=${currentUser.id}&other_id=${clientId}&other_role=evaluator`;
        }

        // EMPLOYER ACTIONS
        function messageFreelancer(freelancerId) {
            window.location.href = `messages.html?user_role=evaluator&user_id=${currentUser.id}&other_id=${freelancerId}&other_role=job_seeker`;
        }

        function rateFreelancer(freelancerId, freelancerName) {
            localStorage.setItem('pendingRating', JSON.stringify({
                freelancerId: freelancerId,
                freelancerName: freelancerName
            }));
            window.location.href = `talent_market.html#rate-${freelancerId}`;
        }

        // Filter bookings
        function filterBookings(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.filter === filter);
            });
            
            renderBookings();
        }

        // Update statistics
        function updateStats() {
            const pending = allBookings.filter(b => b.status === 'pending').length;
            const active = allBookings.filter(b => ['accepted', 'in_progress'].includes(b.status)).length;
            const completed = allBookings.filter(b => b.status === 'completed').length;
            
            // Calculate total: Use client_budget OR freelancer_price
            // Works for both freelancers (earned) and employers (spent)
            const totalAmount = allBookings
                .filter(b => b.status === 'completed')
                .reduce((sum, b) => {
                    const price = b.client_budget || b.freelancer_price || 0;
                    return sum + parseFloat(price);
                }, 0);
        
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('activeCount').textContent = active;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalAmount').textContent = `$${totalAmount.toFixed(2)}`;
        }

        // Load notification count
        async function loadNotificationCount() {
            if (!currentUser) return;

            try {
                const response = await fetch(`${API_BASE}/api/notifications/unread-count?user_role=${currentUser.roleKey}&user_id=${currentUser.id}`);
                
                if (response.ok) {
                    const data = await response.json();
                    const badge = document.getElementById('notificationBadge');
                    
                    if (data.unread_count > 0) {
                        badge.textContent = data.unread_count;
                        badge.style.display = 'inline';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            } catch (error) {
                console.error('Error loading notification count:', error);
            }
        }

        // Initialize page
        init();

        // Refresh data every 30 seconds
        setInterval(() => {
            loadBookings();
            loadNotificationCount();
        }, 30000);
    </script>
</body>
</html>
